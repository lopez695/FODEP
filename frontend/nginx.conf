# Service des fichiers statiques de l'application Flutter Web.
#
# Ce conteneur ne fait QUE servir des fichiers : le HTTPS et le routage vers
# l'API sont assures par le proxy inverse place devant lui.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aucune signature de version : inutile a l'utilisateur, utile a un
    # attaquant qui cherche une faille connue.
    server_tokens off;

    # L'application ne charge que ses propres ressources. Aucun script, aucune
    # police, aucune image d'un tiers : les donnees prudentielles ne doivent
    # emprunter aucun chemin sortant.
    # 'unsafe-inline' et 'unsafe-eval' sont exiges par le moteur Flutter Web.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # L'application ne doit jamais etre encadree dans un site tiers : un cadre
    # invisible permettrait de detourner les clics de l'utilisateur.
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Code de l'application. Flutter ne versionne PAS ces noms de fichiers :
    # les mettre en cache ferait servir l'ancienne application apres chaque
    # mise a jour, jusqu'a expiration. Ils sont donc toujours revalides.
    location ~ ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Ressources reellement immuables : moteur, polices, images, assets. Leur
    # contenu ne change pas sans changement de version de Flutter.
    location ~* \.(?:wasm|png|jpg|jpeg|svg|ttf|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Application a page unique : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
