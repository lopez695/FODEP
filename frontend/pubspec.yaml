name: rwa_calculator
description: Base Flutter modulaire pour un outil RWA.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  desktop_drop: ^0.7.0
  excel: ^4.0.6
  file_selector: ^1.0.3
  http: ^1.2.2
  intl: ^0.20.2
  lottie: ^3.1.2
  pdf: ^3.11.1
  flutter_svg: ^2.0.10+1
  flutter_math_fork: ^0.7.4
  xml: ^6.6.1
  shared_preferences: ^2.5.5
  linked_scroll_controller: ^0.2.0
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1
  spreadsheet_decoder: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/heymanns_logo.png
    - assets/images/logo.png
    - assets/images/logo_header.png
    - assets/images/risk_management.png
    - assets/images/rwa_credit.png
    - assets/images/manage_money_bro.svg
    - assets/flags/
    - assets/lotties/import_loader.json
    - assets/lotties/Success.json
    - assets/lotties/rwa_dashboard.json
    - assets/lotties/yield_curve_no_data.json
  fonts:
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 100
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 200
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 300
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 400
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 500
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 600
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 700
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 800
        - asset: assets/fonts/RobotoFlex-Variable.ttf
          weight: 900
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          weight: 500
